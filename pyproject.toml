[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-support-recommend"
version = "0.1.0"
description = "第4回プロトフェス向け 推薦マイクロサービス（DRSA によるブース推薦）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "scipy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_support_recommend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
